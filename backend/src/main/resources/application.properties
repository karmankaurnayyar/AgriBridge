# AgriBridge backend configuration
# No real credentials are stored here. All environment-specific values are
# read from environment variables, with safe local-dev fallbacks. Copy
# application-dev.properties.example to application-dev.properties and adjust
# values for your own machine (application-dev.properties is git-ignored).

spring.application.name=agribridge-backend

# --- Datasource (MySQL) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agribridge?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'validate' is used rather than 'update' so that database/schema.sql stays
# the single source of truth for the schema (see docs/database-design.md).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- JWT foundation (see docs/architecture.md, Security section) ---
agribridge.jwt.secret=${JWT_SECRET:dev-only-placeholder-secret-change-me-please-32chars}
agribridge.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Logging ---
logging.level.com.agribridge=${LOG_LEVEL:INFO}
